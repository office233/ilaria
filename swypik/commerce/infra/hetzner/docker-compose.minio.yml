services:
  minio:
    # 2026-08-11 (audit): pinned — "latest" putea aduce breaking changes la restart.
    # Aceeași versiune ca în docker-compose.social.yml.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: swypik-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-swypik}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD lipseste din env}"
    volumes:
      - swypik_minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

volumes:
  swypik_minio_data:
