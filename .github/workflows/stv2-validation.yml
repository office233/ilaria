name: STV2 validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Environment
        run: |
          go version
          gcc --version | head -1
          node --version
      - name: Full repository tests
        run: go test -count=1 -timeout=180s ./...
      - name: Static analysis
        run: go vet ./...
      - name: Race detector
        run: go test -race -count=1 -timeout=180s ./experiments/ternaryvm ./internal/swyplang ./cmd/swyp-stv2 ./cmd/swyp ./internal/coreir
      - name: Core IR fuzzing
        run: go test ./internal/coreir -run '^$' -fuzz '^FuzzCoreIRDecode$' -fuzztime=10s -parallel=2
      - name: Core source fuzzing
        run: go test ./internal/swyplang -run '^$' -fuzz '^FuzzCoreLower$' -fuzztime=10s -parallel=2
      - name: Contract fuzzing
        run: go test ./internal/coreir -run '^$' -fuzz '^FuzzContractDecodeAndVerify$' -fuzztime=10s -parallel=2
      - name: Decoder fuzzing
        run: go test ./experiments/ternaryvm -run '^$' -fuzz '^FuzzSTV2DecodeAudit$' -fuzztime=10s -parallel=2
      - name: Assembler fuzzing
        run: go test ./experiments/ternaryvm -run '^$' -fuzz '^FuzzSTV2AssemblyAudit$' -fuzztime=10s -parallel=2
      - name: Compiler fuzzing
        run: go test ./internal/swyplang -run '^$' -fuzz '^FuzzSTV2CompilerAudit$' -fuzztime=10s -parallel=2
      - name: Module contract tests
        run: go test -v -count=1 -run '^TestSWYPB' ./internal/swyplang ./cmd/swyp
      - name: Module loader fuzzing
        run: go test ./internal/swyplang -run '^$' -fuzz '^FuzzSWYPBLoad$' -fuzztime=10s -parallel=2
      - name: Source-free module execution
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          go build -o "$work/swyp" ./cmd/swyp
          cp examples/swyp/sum.stv2.swyp "$work/source.swyp"
          "$work/swyp" compile --target stv2 -o "$work/sum.swypb" "$work/source.swyp"
          rm "$work/source.swyp"
          result="$(PATH="$work" "$work/swyp" exec "$work/sum.swypb" 100)"
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["format"]=="SWYPB" and r["value"]==5050 and r["module_bytes"]==146'
          "$work/swyp" ir -entry next -o "$work/next.core.json" examples/swyp/semantic-core.swyp
          PATH="$work" "$work/swyp" core-exec -entry next "$work/next.core.json" 9007199254740993 > "$work/core-result.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["result"]["value"]=={"type":"i64","value":"9007199254740994"}' "$work/core-result.json"
          "$work/swyp" verify -contract examples/swyp/contracts/square.i64.json examples/swyp/semantic-core.swyp > "$work/verified.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="exhaustive" and r["cases_checked"]==201' "$work/verified.json"
          if "$work/swyp" verify -contract examples/swyp/contracts/square.i64.json examples/swyp/contracts/wrong-square.swyp > "$work/counterexample.json"; then exit 1; fi
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="counterexample"' "$work/counterexample.json"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$work/swyp.exe" ./cmd/swyp
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "$work/swyp-arm64" ./cmd/swyp
      - name: End-to-end example
        run: go run ./cmd/swyp-stv2 examples/swyp/sum.stv2.swyp 100
      - name: Benchmark (diagnostic, not a release gate)
        run: go test ./internal/swyplang -run '^$' -bench '^BenchmarkSTV2LoweredSum$' -benchmem -benchtime=200ms -count=3
