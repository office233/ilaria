name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://swypik.com'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || 'https://swypik.com' }}
      # Din 2026-08-17, playwright.config.ts refuză producția fără acest flag.
      # Aici e intenționat: jobul rulează DOAR proiectul `mobile` (tests/e2e),
      # ale cărui spec-uri sunt read-only — a11y, seo, perf, homepage, search.
      # Proiectele `full-*` (tests/e2e-full) fac signup real și NU sunt incluse.
      ALLOW_PROD_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=mobile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
