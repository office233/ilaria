name: swypik-social

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swypik_social}
      POSTGRES_USER: ${POSTGRES_USER:-swypik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swypik_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - social_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-social_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-swypik}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-swypik_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9002}:9000"
      - "127.0.0.1:${CLICKHOUSE_METRICS_PORT:-9363}:9363"
    volumes:
      - social_clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - social_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-swypik}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-swypik_dev_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - social_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-swypik}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-swypik_dev_password}
      SOCIAL_MEDIA_BUCKET: ${SOCIAL_MEDIA_BUCKET:-social-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${SOCIAL_MEDIA_BUCKET}"
        mc anonymous set download "local/$${SOCIAL_MEDIA_BUCKET}/public" || true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # nosemgrep: trailofbits.generic.postgres-insecure-sslmode.postgres-insecure-sslmode - local Docker network only; TLS is not enabled on this dev Postgres service.
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-swypik}:${POSTGRES_PASSWORD:-swypik_dev_password}@postgres:5432/${POSTGRES_DB:-swypik_social}?sslmode=disable
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # nosemgrep: trailofbits.generic.redis-unencrypted-transport.redis-unencrypted-transport - local Docker network only; Redis TLS is not enabled for the dev exporter.
      REDIS_ADDR: redis://redis:6379
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - social_prometheus_data:/prometheus
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-swypik_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-swypik_social}
      POSTGRES_USER: ${POSTGRES_USER:-swypik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swypik_dev_password}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - social_grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

# Production media storage should use Cloudflare R2 or another S3-compatible
# object store. Keep MinIO for local development only, and point S3_ENDPOINT,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, and SOCIAL_MEDIA_BUCKET at R2 in env.

volumes:
  social_postgres_data:
  social_redis_data:
  social_clickhouse_data:
  social_opensearch_data:
  social_minio_data:
  social_prometheus_data:
  social_grafana_data:
