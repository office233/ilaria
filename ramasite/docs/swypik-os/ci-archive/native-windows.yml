name: Verify native Windows desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.2'
          cache: false
      - name: Test, vet and build native PE artifacts
        run: ./scripts/build.ps1
      - name: Inspect dependency graph for retired desktop runtimes
        run: |
          $deps = @(& go list -deps ./cmd/swypik-os)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect native dependencies.' }
          if ($deps | Where-Object { $_ -match '(^swypik-os/ui/web$|(?i:electron|chromium|webview))' }) {
            throw 'A retired hosted-desktop dependency entered the native EXE graph.'
          }
      - name: Check concurrent code with the race detector
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path out/windows-validation | Out-Null
          & go test -race -count=1 -timeout=5m -json ./... | Tee-Object -FilePath out/windows-validation/race-tests.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Race-detector tests failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: native-windows-${{ github.sha }}
          path: |
            bin/swypik-os.exe
            bin/swypik-os-console.exe
            bin/swypik-os-windows-*.zip
            bin/build-manifest.json
            bin/SHA256SUMS
            out/windows-validation/*.jsonl
          retention-days: 7
