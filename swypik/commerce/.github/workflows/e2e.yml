name: e2e

on:
  # Smoke-ul lovește intenționat producția, deci nu rulează pe PR-uri: un PR
  # nu poate schimba încă swypik.com și ar fi blocat de starea live precedentă.
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://swypik.com'

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || 'https://swypik.com' }}
      # Din 2026-08-17, playwright.config.ts refuză producția fără acest flag.
      # Aici e intenționat: jobul rulează DOAR proiectul `mobile` (tests/e2e),
      # ale cărui spec-uri sunt read-only — a11y, seo, perf, homepage, search.
      # Proiectele `full-*` (tests/e2e-full) fac signup real și NU sunt incluse.
      ALLOW_PROD_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=mobile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
