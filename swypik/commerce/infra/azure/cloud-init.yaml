#cloud-config
# ============================================================================
# Swypik — cloud-init comun pentru toate rolurile (Ubuntu 24.04 LTS)
# ============================================================================
# main.bicep înlocuiește la deploy:
#   __SWYPIK_ROLE__        → web | data | worker   (scris în /etc/swypik/role)
#   __DEV_AUTHORIZED_KEY__ → cheia publică internă de deploy (userul dev)
# Pe Hetzner același fișier merge ca "User data" (înlocuiești manual cele 2
# valori; discul de date e detectat și prin /dev/disk/by-id/scsi-0HC_Volume_*).
#
# NU conține secrete: tokenul Cloudflare Tunnel → /etc/cloudflared/tunnel.env
# (doar pe web, la runtime); fișierele .env → /opt/swypik/env (la runtime).
# cloudflared-swypik rămâne OPRIT până la cutover.
# Log: /var/log/cloud-init-output.log · marcaj: /var/lib/swypik/cloud-init.done
# ============================================================================

timezone: Europe/Bucharest
locale: en_US.UTF-8

package_update: true
package_upgrade: true
package_reboot_if_required: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - unattended-upgrades
  - apt-listchanges
  - fail2ban
  - logrotate
  - postgresql-client-16
  - redis-tools
  - htop
  - iotop
  - ncdu
  - chrony

# Grupul docker există ÎNAINTE de userul dev (docker-ce îl refolosește).
groups:
  - docker

users:
  - default
  - name: dev
    gecos: Swypik deploy/runtime (git, docker compose; fara sudo)
    shell: /bin/bash
    groups: [docker]
    lock_passwd: true
    ssh_authorized_keys:
      - "__DEV_AUTHORIZED_KEY__"

# Swap 8 GiB pe discul OS (build-ul Next.js / ffmpeg au vârfuri de memorie).
swap:
  filename: /swapfile
  size: 8589934592

write_files:
  - path: /etc/swypik/role
    permissions: "0644"
    content: |
      __SWYPIK_ROLE__

  - path: /etc/sysctl.d/90-swypik.conf
    permissions: "0644"
    content: |
      vm.swappiness = 10
      vm.overcommit_memory = 1
      vm.dirty_background_ratio = 5
      vm.dirty_ratio = 15
      vm.max_map_count = 262144
      fs.file-max = 2097152
      fs.inotify.max_user_watches = 524288
      net.core.somaxconn = 4096
      net.ipv4.tcp_max_syn_backlog = 4096
      net.ipv4.ip_local_port_range = 10240 65535
      net.ipv4.tcp_keepalive_time = 300
      net.ipv4.tcp_fin_timeout = 15

  - path: /etc/tmpfiles.d/swypik-thp.conf
    permissions: "0644"
    content: |
      # Redis + Postgres: fără transparent huge pages.
      w /sys/kernel/mm/transparent_hugepage/enabled - - - - never
      w /sys/kernel/mm/transparent_hugepage/defrag - - - - never

  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "data-root": "/srv/data/docker",
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" },
        "live-restore": true,
        "userland-proxy": false,
        "default-address-pools": [{ "base": "172.30.0.0/16", "size": 24 }]
      }

  - path: /etc/systemd/system/docker.service.d/10-wait-data.conf
    permissions: "0644"
    content: |
      [Unit]
      # Pe rolul data /srv/data e discul Premium; Docker pornește după montare.
      RequiresMountsFor=/srv/data

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52swypik-unattended
    permissions: "0644"
    content: |
      // Doar securitate; reboot MANUAL, câte un nod pe rând (runbook).
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
      };
      // Docker Engine nu se actualizează automat (ar reporni containerele).
      Unattended-Upgrade::Package-Blacklist { "docker-ce"; "docker-ce-cli"; "containerd.io"; };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

  - path: /etc/ssh/sshd_config.d/10-swypik.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # dev rulează deploy-ul fără root; singurul privilegiu: drenarea conectorului
  # cloudflared al nodului în timpul rolling deploy-ului.
  - path: /etc/sudoers.d/swypik-dev
    permissions: "0440"
    content: |
      dev ALL=(root) NOPASSWD: /usr/bin/systemctl stop cloudflared-swypik, /usr/bin/systemctl start cloudflared-swypik, /usr/bin/systemctl is-active cloudflared-swypik

  - path: /etc/fail2ban/jail.d/swypik.local
    permissions: "0644"
    content: |
      [DEFAULT]
      backend = systemd
      bantime = 1h
      findtime = 10m
      maxretry = 5
      bantime.increment = true
      # Rețeaua privată (deploy fan-out de pe web-1) nu se banează.
      ignoreip = 127.0.0.1/8 ::1 10.60.0.0/16

      [sshd]
      enabled = true
      port = ssh

  - path: /etc/logrotate.d/swypik
    permissions: "0644"
    content: |
      /opt/swypik/logs/*.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
          create 0640 root root
      }

  # Cloudflare Tunnel (doar rol web) — ACELAȘI tunel pe toate VM-urile web
  # (replici ale conectorului = load balancing + HA la Cloudflare).
  # Tokenul: /etc/cloudflared/tunnel.env (TUNNEL_TOKEN=...), root 600.
  - path: /etc/systemd/system/cloudflared-swypik.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Cloudflare Tunnel connector (Swypik)
      After=network-online.target docker.service
      Wants=network-online.target
      ConditionPathExists=/etc/cloudflared/tunnel.env

      [Service]
      Type=notify
      EnvironmentFile=/etc/cloudflared/tunnel.env
      # grace-period: la drain (deploy) conexiunile în curs se termină curat.
      ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel --metrics 127.0.0.1:20241 --grace-period 30s run
      Restart=on-failure
      RestartSec=5s
      TimeoutStopSec=40s
      User=cloudflared
      Group=cloudflared
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/swypik-bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Rulat o dată de cloud-init. Idempotent.
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      ROLE=$(tr -d '[:space:]' < /etc/swypik/role)
      case "$ROLE" in web|data|worker) ;; *) echo "rol invalid: '$ROLE'"; exit 1 ;; esac
      echo "rol: $ROLE"

      # ── disc de date (rolul data): Azure LUN 0 sau volum Hetzner ──
      mkdir -p /srv/data
      if [ "$ROLE" = data ]; then
        # Azure NVMe (v6/v7, azure-vm-utils): /dev/disk/azure/data/by-lun/0; Azure SCSI (v5): scsi1/lun0;
        # Hetzner: volum by-id. Fallback NVMe: singurul disc NVMe care nu conține rădăcina.
        dev=""
        root_disk=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)" 2>/dev/null | head -1)
        for _ in $(seq 1 30); do
          for c in /dev/disk/azure/data/by-lun/0 /dev/disk/azure/scsi1/lun0 /dev/disk/by-id/scsi-0HC_Volume_*; do
            [ -e "$c" ] && { dev=$(readlink -f "$c"); break; }
          done
          if [ -z "$dev" ]; then
            for d in $(lsblk -dnpo NAME,TYPE | awk '$2=="disk" && $1 ~ /nvme/ {print $1}'); do
              [ "$(basename "$d")" = "$root_disk" ] && continue
              dev="$d"; break
            done
          fi
          [ -n "$dev" ] && break
          sleep 2
        done
        [ -n "$dev" ] || { echo "EROARE: discul de date nu există"; exit 1; }
        echo "disc de date: $dev"
        if ! blkid -L swypikdata >/dev/null 2>&1; then
          # Doar un disc GOL se formatează (fără semnătură de FS/partiție).
          if [ -z "$(blkid -o value -s TYPE "$dev" 2>/dev/null)" ] && [ -z "$(lsblk -no NAME "$dev" | tail -n +2)" ]; then
            mkfs.ext4 -q -L swypikdata "$dev"
          else
            echo "EROARE: $dev are date dar nu eticheta swypikdata — nu formatez"; exit 1
          fi
        fi
        grep -q 'LABEL=swypikdata' /etc/fstab || \
          echo 'LABEL=swypikdata /srv/data ext4 defaults,noatime,nofail,x-systemd.device-timeout=60s 0 2' >> /etc/fstab
        systemctl daemon-reload
        mount /srv/data 2>/dev/null || mountpoint -q /srv/data
        mountpoint -q /srv/data || { echo "EROARE: /srv/data nu e montat"; exit 1; }
      fi

      # ── Docker Engine + compose plugin (repo oficial) ──
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list
      pkgs="docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"

      # ── cloudflared (doar web) ──
      if [ "$ROLE" = web ]; then
        curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg -o /usr/share/keyrings/cloudflare-main.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
          > /etc/apt/sources.list.d/cloudflared.list
        pkgs="$pkgs cloudflared"
      else
        rm -f /etc/systemd/system/cloudflared-swypik.service
      fi
      apt-get update
      # shellcheck disable=SC2086
      apt-get install -y $pkgs

      # ── directoare (identice pe toate rolurile) ──
      mkdir -p /srv/data/docker /srv/data/backups/postgres \
               /srv/data/video-processing /opt/swypik/env /opt/swypik/logs /var/lib/swypik
      [ -e /opt/swypik/backups ] || ln -s /srv/data/backups /opt/swypik/backups
      # /srv/data/backups: dev scrie dump-urile pre-deploy (infra/azure/node/pre-deploy-dump.sh
      # rulează ca dev prin SSH) — root:root 750 le bloca.
      chown -R dev:dev /opt/swypik /srv/data/video-processing /srv/data/backups
      chmod 700 /opt/swypik/env
      chmod 750 /srv/data/backups /srv/data/backups/postgres

      if [ "$ROLE" = web ]; then
        id cloudflared >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin cloudflared
        install -d -m 0750 -o root -g cloudflared /etc/cloudflared
      fi

      sysctl --system >/dev/null
      systemd-tmpfiles --create /etc/tmpfiles.d/swypik-thp.conf || true
      systemctl daemon-reload
      systemctl enable --now docker fail2ban unattended-upgrades
      systemctl restart ssh || true
      docker --version
      docker compose version
      [ "$ROLE" = web ] && cloudflared --version
      date -Iseconds > /var/lib/swypik/cloud-init.done

runcmd:
  - [bash, /usr/local/sbin/swypik-bootstrap.sh]

final_message: "Swypik bootstrap terminat în $UPTIME s — /var/lib/swypik/cloud-init.done"
